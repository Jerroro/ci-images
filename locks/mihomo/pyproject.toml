[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mihomo-config"
version = "0.8.1"
description = "Offline Mihomo policy compilation, local snapshot validation and WAL-protected R2 publication"
requires-python = ">=3.13,<3.15"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
mc = "mihomo_config.cli:main"
mihomo-config = "mihomo_config.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-xdist==3.8.0", "ruff==0.14.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/policy", "tests/integration"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
